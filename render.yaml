services:
  - type: web
    name: label4security
    env: node
    buildCommand: npm install && npx prisma@6.19.3 generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://label4security.onrender.com
